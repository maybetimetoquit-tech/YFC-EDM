<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 GitHub Pages 測試網站</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 { color: #2ea44f; }
        p { color: #57606a; }
        .success-icon {
            font-size: 50px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">🚀</div>
        <h1>Hello, GitHub Pages!</h1>
        <p>如果你看到這個頁面，代表你的網站已經成功發布了！</p>
        <p id="time"></p>
    </div>

    <script>
        // 顯示測試時間，證明網頁是活的
        const now = new Date();
        document.getElementById('time').innerText = "最後更新時間：" + now.toLocaleString();
    </script>
</body>
</html>
