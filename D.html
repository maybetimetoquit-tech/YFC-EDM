<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>EDM</title>
    <meta name="author" content="Donny Chen" />
    <script src="./css_js/page-flip.browser.min.js"></script>
    <link rel="stylesheet" href="./css_js/edm_style.css">
</head>
<body>

<div class="overlay-hint">滑鼠滾輪：縮放照片 │ 按住左鍵：拖拽移動 │ 點擊空白處：關閉預覽</div>

<div id="image-overlay">
    <div id="image-container">
        <img id="large-img" src="">
    </div>
</div>

<div id="book-wrapper">
    <div id="click-prev" class="click-layer"></div>
    <div id="click-next" class="click-layer"></div>
    <div id="my-album">
 <!---------->
<div class="page">
    <img loading="lazy" src="images/thumbs/D01.jpg?v=1" onClick="viewLarge('images/D01.jpg?v=1', event)">
</div>
  <div class="page">
    <img loading="lazy" src="images/thumbs/D02.jpg?v=1" onClick="viewLarge('images/D02.jpg?v=1', event)">
</div>      
  <div class="page">
    <img loading="lazy" src="images/thumbs/D03.jpg?v=1" onClick="viewLarge('images/D03.jpg?v=1', event)">
</div>      
<div class="page">
    <img loading="lazy" src="images/thumbs/D04.jpg?v=1" onClick="viewLarge('images/D04.jpg?v=1', event)">
</div>
  <div class="page">
    <img loading="lazy" src="images/thumbs/D05.jpg?v=1" onClick="viewLarge('images/D05.jpg?v=1', event)">
</div>      
  <div class="page">
    <img loading="lazy" src="images/thumbs/D06.jpg?v=1" onClick="viewLarge('images/D06.jpg?v=1', event)">
</div>  
<div class="page">
    <img loading="lazy" src="images/thumbs/D07.jpg?v=1" onClick="viewLarge('images/D07.jpg?v=1', event)">
</div>
  <div class="page">
    <img loading="lazy" src="images/thumbs/D08.jpg?v=1" onClick="viewLarge('images/D08.jpg?v=1', event)">
</div>      
  <div class="page">
    <img loading="lazy" src="images/thumbs/D09.jpg?v=1" onClick="viewLarge('images/D09.jpg?v=1', event)">
</div>  
<div class="page">
    <img loading="lazy" src="images/thumbs/D10.jpg?v=1" onClick="viewLarge('images/D10.jpg?v=1', event)">
</div>
  <div class="page">
    <img loading="lazy" src="images/thumbs/D11.jpg?v=1" onClick="viewLarge('images/D11.jpg?v=1', event)">
</div>      
  <div class="page">
    <img loading="lazy" src="images/thumbs/D12.jpg?v=1" onClick="viewLarge('images/D12.jpg?v=1', event)">
</div>         
 <!---------->      
    </div>
</div>

<script>
    let flipBook = null;
    let imgWidth = 85;
    let isDragging = false;
    let lastPageIndex = 0; // 紀錄關閉前的頁碼

    const overlay = document.getElementById('image-overlay');
    const hint = document.querySelector('.overlay-hint');
    const container = document.getElementById('image-container');
    const largeImg = document.getElementById('large-img');
    const bookWrapper = document.getElementById('book-wrapper');

    function initFlipBook(startPage = 0) {
        const el = document.getElementById('my-album');
        if (typeof St !== 'undefined' && el) {
            // 如果已有實體先銷毀 (某些版本支援 destroy)
            if (flipBook) { try { flipBook.destroy(); } catch(e) {} }

            flipBook = new St.PageFlip(el, {
                width: 600, height: 800, size: "fixed", 
                showCover: true, drawShadow: true, 
                clickEventForward: false,
                useMouseEvents: true // 這是關鍵，關閉大圖時才設為 true
            });
            flipBook.loadFromHTML(document.querySelectorAll('.page'));
            
            // 重新跳轉到之前的頁面
            setTimeout(() => {
                flipBook.turnToPage(startPage);
            }, 100);
        }
    }

    window.onload = () => {
        initFlipBook(0);
        document.getElementById('click-prev').onclick = () => { if(flipBook) flipBook.flipPrev(); };
        document.getElementById('click-next').onclick = () => { if(flipBook) flipBook.flipNext(); };
    };

    function viewLarge(src, event) {
        if (event) {
            event.stopPropagation();
            event.preventDefault();
        }
        
        // 紀錄當前頁碼
        if (flipBook) lastPageIndex = flipBook.getCurrentPageIndex();

        // 徹底阻斷底層所有點擊
        bookWrapper.style.visibility = 'hidden'; 

        imgWidth = 85;
        largeImg.style.width = imgWidth + '%';
        largeImg.src = src;
        overlay.style.display = 'block';
        hint.style.display = 'block';
        overlay.scrollTop = 0;
    }

    function closeLarge(event) {
        if (event) {
            event.stopPropagation();
            event.preventDefault();
        }
        
        overlay.style.display = 'none';
        hint.style.display = 'none';
        
        // 恢復書本顯示並重新定位
        bookWrapper.style.visibility = 'visible';
        
        // 重新初始化或強制更新一次，確保不會跳頁
        setTimeout(() => {
            if(flipBook) flipBook.turnToPage(lastPageIndex);
        }, 50);
    }

    // 縮放與拖拽邏輯
    overlay.addEventListener('wheel', (e) => {
        e.preventDefault(); 
        if (e.deltaY < 0) imgWidth = Math.min(500, imgWidth + 10);
        else imgWidth = Math.max(20, imgWidth - 10);
        largeImg.style.width = imgWidth + '%';
    }, { passive: false });

    container.onmousedown = (e) => {
        if (e.target === container) { closeLarge(e); return; }
        isDragging = true;
        startX = e.pageX - overlay.offsetLeft;
        startY = e.pageY - overlay.offsetTop;
        scrollLeft = overlay.scrollLeft;
        scrollTop = overlay.scrollTop;
    };

    largeImg.onmousedown = (e) => {
        e.preventDefault();
        isDragging = true;
        startX = e.pageX - overlay.offsetLeft;
        startY = e.pageY - overlay.offsetTop;
        scrollLeft = overlay.scrollLeft;
        scrollTop = overlay.scrollTop;
    };

    window.onmousemove = (e) => {
        if (!isDragging) return;
        overlay.scrollLeft = scrollLeft - (e.pageX - overlay.offsetLeft - startX);
        overlay.scrollTop = scrollTop - (e.pageY - overlay.offsetTop - startY);
    };

    window.onmouseup = () => isDragging = false;
</script>

</body>
</html>
