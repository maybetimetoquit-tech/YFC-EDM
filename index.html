<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>EDM</title>
    <meta name="author" content="Donny Chen" />
    <script src="https://maybetimetoquit-tech.github.io/YFC-EDM/css_js/page-flip.browser.min.js"></script>
    <link rel="stylesheet" href="https://maybetimetoquit-tech.github.io/YFC-EDM/css_js/edm_style.css">
</head>
<body>
<div class="overlay-hint" id="overlay-hint">
    <span class="d-none d-md-inline">滑鼠滾輪：縮放照片 │ 按住左鍵：拖拽移動 │ 點擊空白處：關閉</span>
</div>
<div id="image-overlay">
    <div id="image-container">
        <img id="large-img" src="">
    </div>
</div>

<div id="book-wrapper">
    <div id="click-prev" class="click-layer"></div>
    <div id="click-next" class="click-layer"></div>
    <div id="my-album">
 <!---------->
<div class="page">
    <img loading="lazy" src="images/thumbs/A01.jpg?v=1" onClick="viewLarge('images/A01.jpg?v=1', event)">
</div>
  <div class="page">
    <img loading="lazy" src="images/thumbs/A02.jpg?v=1" onClick="viewLarge('images/A02.jpg?v=1', event)">
</div>      
  <div class="page">
    <img loading="lazy" src="images/thumbs/A03.jpg?v=1" onClick="viewLarge('images/A03.jpg?v=1', event)">
</div>      
<div class="page">
    <img loading="lazy" src="images/thumbs/A04.jpg?v=1" onClick="viewLarge('images/A04.jpg?v=1', event)">
</div>
  <div class="page">
    <img loading="lazy" src="images/thumbs/A05.jpg?v=1" onClick="viewLarge('images/A05.jpg?v=1', event)">
</div>      
  <div class="page">
    <img loading="lazy" src="images/thumbs/A06.jpg?v=1" onClick="viewLarge('images/A06.jpg?v=1', event)">
</div>  
<div class="page">
    <img loading="lazy" src="images/thumbs/A07.jpg?v=1" onClick="viewLarge('images/A07.jpg?v=1', event)">
</div>
  <div class="page">
    <img loading="lazy" src="images/thumbs/A08.jpg?v=1" onClick="viewLarge('images/A08.jpg?v=1', event)">
</div>      
  <div class="page">
    <img loading="lazy" src="images/thumbs/A09.jpg?v=1" onClick="viewLarge('images/A09.jpg?v=1', event)">
</div>  
<div class="page">
    <img loading="lazy" src="images/thumbs/A10.jpg?v=1" onClick="viewLarge('images/A10.jpg?v=1', event)">
</div>
  <div class="page">
    <img loading="lazy" src="images/thumbs/A11.jpg?v=1" onClick="viewLarge('images/A11.jpg?v=1', event)">
</div>      
  <div class="page">
    <img loading="lazy" src="images/thumbs/A12.jpg?v=1" onClick="viewLarge('images/A12.jpg?v=1', event)">
</div>         
 <!---------->      
    </div>
</div>
<script>
    // 1. 所有全域變數宣告
    let flipBook = null;
    let imgWidth = 85;
    let isDragging = false;
    let lastPageIndex = 0;
    let startX, startY, scrollLeft, scrollTop; // 確保變數已定義，防止 GitHub 報錯

    const overlay = document.getElementById('image-overlay');
    const hint = document.getElementById('overlay-hint'); 
    const container = document.getElementById('image-container');
    const largeImg = document.getElementById('large-img');
    const bookWrapper = document.getElementById('book-wrapper');

    // 2. 初始化翻頁書函式
    function initFlipBook(startPage = 0) {
        const el = document.getElementById('my-album');
        if (typeof St !== 'undefined' && el && el.children.length > 0) {
            if (flipBook) { 
                try { flipBook.destroy(); } catch(e) { console.warn(e); } 
            }

            flipBook = new St.PageFlip(el, {
                width: 600, 
                height: 800, 
                size: "stretch",             
                minWidth: 200,
                minHeight: 250,
                maxWidth: 2000,
                maxHeight: 2000,
                showCover: false,   // 改為 false，避免封面特殊處理
                drawShadow: true, 
                usePortrait: true,  // ★最關鍵：強制開啟單頁（縱向）模式
                autoSize: true,     // 自動調整大小
                clickEventForward: false,
                useMouseEvents: true 
            });

            const pages = document.querySelectorAll('.page');
            if(pages.length > 0) {
                flipBook.loadFromHTML(pages);
            }
            
            setTimeout(() => {
                if(flipBook) flipBook.turnToPage(startPage);
            }, 200);
        }
    }

    // 3. 網頁載入完成後的動作
    window.onload = () => {
        initFlipBook(0);
        
        // 確保按鈕存在再綁定點擊事件
        const prevBtn = document.getElementById('click-prev');
        const nextBtn = document.getElementById('click-next');
        if(prevBtn) prevBtn.onclick = () => { if(flipBook) flipBook.flipPrev(); };
        if(nextBtn) nextBtn.onclick = () => { if(flipBook) flipBook.flipNext(); };
        
        // 綁定背景點擊關閉
        if(container) {
            container.onclick = (e) => { if (e.target === container) closeLarge(e); };
        }
    };

    // 4. 滑鼠按下事件 (你剛才加的那兩段)
    if(container) {
        container.onmousedown = (e) => {
            if (e.target === container) { closeLarge(e); return; }
            isDragging = true;
            startX = e.pageX - overlay.offsetLeft;
            startY = e.pageY - overlay.offsetTop;
            scrollLeft = overlay.scrollLeft;
            scrollTop = overlay.scrollTop;
        };
    }

    if(largeImg) {
        largeImg.onmousedown = (e) => {
            e.preventDefault();
            isDragging = true;
            startX = e.pageX - overlay.offsetLeft;
            startY = e.pageY - overlay.offsetTop;
            scrollLeft = overlay.scrollLeft;
            scrollTop = overlay.scrollTop;
        };
    }

    // 5. 其他功能函式
    function viewLarge(src, event) {
        if (event) {
            event.stopPropagation();
            event.preventDefault();
        }
        if (flipBook) lastPageIndex = flipBook.getCurrentPageIndex();
        bookWrapper.style.visibility = 'hidden'; 
        imgWidth = 85;
        largeImg.style.width = imgWidth + '%';
        largeImg.src = src;
        overlay.style.display = 'block';
        hint.style.display = 'block';
        overlay.scrollTop = 0;
    }

    function closeLarge(event) {
        if (event) {
            event.stopPropagation();
            event.preventDefault();
        }
        overlay.style.display = 'none';
        hint.style.display = 'none';
        bookWrapper.style.visibility = 'visible';
        setTimeout(() => {
            if(flipBook) flipBook.turnToPage(lastPageIndex);
        }, 50);
    }

    // 6. 縮放與移動偵測
    overlay.addEventListener('wheel', (e) => {
        e.preventDefault(); 
        if (e.deltaY < 0) imgWidth = Math.min(500, imgWidth + 10);
        else imgWidth = Math.max(20, imgWidth - 10);
        largeImg.style.width = imgWidth + '%';
    }, { passive: false });

    window.onmousemove = (e) => {
        if (!isDragging) return;
        overlay.scrollLeft = scrollLeft - (e.pageX - overlay.offsetLeft - startX);
        overlay.scrollTop = scrollTop - (e.pageY - overlay.offsetTop - startY);
    };

    window.onmouseup = () => isDragging = false;
</script>
</body>
</html>
