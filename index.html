<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EDM</title>
    <meta name="author" content="Donny Chen" />
    <script src="https://maybetimetoquit-tech.github.io/YFC-EDM/css_js/page-flip.browser.min.js"></script>
    <link rel="stylesheet" href="https://maybetimetoquit-tech.github.io/YFC-EDM/css_js/edm_style.css">
    <style>
        #tab-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            display: flex;
            justify-content: center;
            gap: 6px;
            padding: 8px 10px;
            background: rgba(240,240,240,0.95);
            z-index: 999;
            flex-wrap: wrap;
        }
        #tab-bar button {
            padding: 6px 14px;
            border: 2px solid #aaa;
            border-radius: 20px;
            background: #fff;
            cursor: pointer;
            font-size: 13px;
            font-family: sans-serif;
            transition: all 0.2s;
        }
        #tab-bar button.active {
            background: #333;
            color: #fff;
            border-color: #333;
        }
        #book-wrapper {
            margin-top: 50px;
        }
        #loading-msg {
            position: fixed;
            top: 55px; left: 12px;
            font-size: 13px;
            color: #888;
            font-family: sans-serif;
            z-index: 998;
            display: none;
        }

        /* 電腦版大圖 overlay */
        #image-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.98); z-index: 1000000; overflow: auto;
        }
        #image-container {
            display: block; text-align: center; width: 100%; padding: 100px 0;
            min-height: 100vh; cursor: grab;
        }
        #large-img {
            width: 85%; height: auto; display: inline-block;
            box-shadow: 0 5px 30px rgba(0,0,0,0.15);
            transition: width 0.05s linear;
        }
        .overlay-hint {
            display: none;
            position: fixed;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 2000000;
            white-space: nowrap;
            pointer-events: none;
        }

        /* 手機版：隱藏電腦版大圖功能 */
        @media (max-width: 767.98px) {
            body { background: #fff; }
            #book-wrapper {
                margin-top: 46px;
                height: calc(100vh - 46px) !important;
                width: 100vw !important;
            }
            #tab-bar { gap: 4px; padding: 6px 6px; }
            #tab-bar button { padding: 5px 10px; font-size: 12px; }
            #image-overlay, .overlay-hint { display: none !important; }
            .page img { cursor: default; }
        }
    </style>
</head>
<body>

<div id="tab-bar">
    <button class="active" onclick="switchCategory('A')">POE DM</button>
    <button onclick="switchCategory('B')">SPE DM</button>
    <button onclick="switchCategory('C')">Power Cord</button>
    <button onclick="switchCategory('D')">Industrial Cable</button>
    <button onclick="switchCategory('E')">Drag Chain Cable</button>
</div>

<div id="loading-msg">Loading...</div>

<div class="overlay-hint" id="overlay-hint">
    <span>滑鼠滾輪：縮放照片 │ 按住左鍵：拖拽移動 │ 點擊空白處：關閉</span>
</div>

<div id="image-overlay">
    <div id="image-container">
        <img id="large-img" src="">
    </div>
</div>

<div id="book-wrapper">
    <div id="click-prev" class="click-layer"></div>
    <div id="click-next" class="click-layer"></div>
    <div id="my-album"></div>
</div>

<script>
    const isMobile = window.innerWidth < 768;

    let currentCategory = 'A';
    let flipBook = null;
    let imgWidth = 85;
    let isDragging = false;
    let lastPageIndex = 0;
    let startX, startY, scrollLeft, scrollTop;

    const overlay = document.getElementById('image-overlay');
    const hint = document.getElementById('overlay-hint');
    const container = document.getElementById('image-container');
    const largeImg = document.getElementById('large-img');
    const bookWrapper = document.getElementById('book-wrapper');
    const loadingMsg = document.getElementById('loading-msg');

    // 依裝置決定圖片點擊行為
    function makePageHTML(thumb, full) {
        if (isMobile) {
            // 手機：直接用大圖，不需要點擊放大
            return `<div class="page"><img loading="lazy" src="${full}"></div>`;
        } else {
            // 電腦：用縮圖，點擊開大圖
            return `<div class="page"><img loading="lazy" src="${thumb}" onClick="viewLarge('${full}', event)"></div>`;
        }
    }

    async function buildPages(category) {
        const album = document.getElementById('my-album');
        if (!album) return;
        album.innerHTML = '';
        loadingMsg.style.display = 'block';

        let i = 1;
        let initialized = false;

        while (true) {
            const num = String(i).padStart(2, '0');
            const thumb = `images/thumbs/${category}/${category}${num}.jpg?v=1`;
            const full  = `images/${category}/${category}${num}.jpg?v=1`;

            const exists = await fetch(thumb, { method: 'HEAD' })
                .then(res => res.ok)
                .catch(() => false);

            if (!exists) break;

            const page = document.createElement('div');
            page.className = 'page';
            if (isMobile) {
                page.innerHTML = `<img loading="lazy" src="${full}">`;
            } else {
                page.innerHTML = `<img loading="lazy" src="${thumb}" onClick="viewLarge('${full}', event)">`;
            }
            album.appendChild(page);

            if (!initialized) {
                loadingMsg.style.display = 'none';
                initFlipBook(0);
                initialized = true;
            } else if (flipBook) {
                flipBook.updateFromHtml(document.querySelectorAll('.page'));
            }

            i++;
        }

        loadingMsg.style.display = 'none';
    }

    async function switchCategory(category) {
        if (category === currentCategory) return;
        currentCategory = category;

        document.querySelectorAll('#tab-bar button').forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('onclick') === `switchCategory('${category}')`);
        });

        if (flipBook) { try { flipBook.destroy(); } catch(e) {} flipBook = null; }
        const bw = document.getElementById('book-wrapper');
        const oldAlbum = document.getElementById('my-album');
        if (oldAlbum) bw.removeChild(oldAlbum);
        const newAlbum = document.createElement('div');
        newAlbum.id = 'my-album';
        bw.appendChild(newAlbum);

        lastPageIndex = 0;
        await buildPages(category);
    }

    function initFlipBook(startPage = 0) {
        const el = document.getElementById('my-album');
        if (typeof St !== 'undefined' && el && el.children.length > 0) {
            if (flipBook) { try { flipBook.destroy(); } catch(e) {} }

            const w = isMobile ? window.innerWidth : Math.min(window.innerWidth, 1200);
            const h = isMobile ? window.innerHeight - 46 : window.innerHeight;

            flipBook = new St.PageFlip(el, {
                width: isMobile ? w : w / 2,
                height: h,
                size: "stretch",
                minWidth: 150,
                minHeight: 200,
                maxWidth: 2500,
                maxHeight: 2500,
                showCover: false,
                usePortrait: true,
                drawShadow: !isMobile,
                clickEventForward: false,
                useMouseEvents: !isMobile, // 手機用觸控，電腦用滑鼠
                swipeDistance: isMobile ? 20 : 30,
            });

            const pages = document.querySelectorAll('.page');
            if (pages.length > 0) { flipBook.loadFromHTML(pages); }

            setTimeout(() => {
                if (flipBook) flipBook.turnToPage(startPage);
            }, 200);
        }
    }

    window.addEventListener('resize', () => {
        setTimeout(async () => {
            const page = flipBook ? flipBook.getCurrentPageIndex() : 0;
            if (flipBook) { try { flipBook.destroy(); } catch(e) {} flipBook = null; }
            const bw = document.getElementById('book-wrapper');
            const oldAlbum = document.getElementById('my-album');
            if (oldAlbum) bw.removeChild(oldAlbum);
            const newAlbum = document.createElement('div');
            newAlbum.id = 'my-album';
            bw.appendChild(newAlbum);
            await buildPages(currentCategory);
            setTimeout(() => { if (flipBook) flipBook.turnToPage(page); }, 200);
        }, 300);
    });

    window.onload = async () => {
        await buildPages(currentCategory);

        const prevBtn = document.getElementById('click-prev');
        const nextBtn = document.getElementById('click-next');
        if (prevBtn) prevBtn.onclick = () => { if (flipBook) flipBook.flipPrev(); };
        if (nextBtn) nextBtn.onclick = () => { if (flipBook) flipBook.flipNext(); };

        if (!isMobile && container) {
            container.onclick = (e) => { if (e.target === container) closeLarge(e); };
        }
    };

    // 電腦版大圖功能
    if (!isMobile) {
        if (container) {
            container.onmousedown = (e) => {
                if (e.target === container) { closeLarge(e); return; }
                isDragging = true;
                startX = e.pageX - overlay.offsetLeft;
                startY = e.pageY - overlay.offsetTop;
                scrollLeft = overlay.scrollLeft;
                scrollTop = overlay.scrollTop;
            };
        }
        if (largeImg) {
            largeImg.onmousedown = (e) => {
                e.preventDefault();
                isDragging = true;
                startX = e.pageX - overlay.offsetLeft;
                startY = e.pageY - overlay.offsetTop;
                scrollLeft = overlay.scrollLeft;
                scrollTop = overlay.scrollTop;
            };
        }
        overlay.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.deltaY < 0) imgWidth = Math.min(500, imgWidth + 10);
            else imgWidth = Math.max(20, imgWidth - 10);
            largeImg.style.width = imgWidth + '%';
        }, { passive: false });

        window.onmousemove = (e) => {
            if (!isDragging) return;
            overlay.scrollLeft = scrollLeft - (e.pageX - overlay.offsetLeft - startX);
            overlay.scrollTop = scrollTop - (e.pageY - overlay.offsetTop - startY);
        };
        window.onmouseup = () => isDragging = false;
    }

    function viewLarge(src, event) {
        if (isMobile) return;
        if (event) { event.stopPropagation(); event.preventDefault(); }
        if (flipBook) lastPageIndex = flipBook.getCurrentPageIndex();
        bookWrapper.style.visibility = 'hidden';
        imgWidth = 85;
        largeImg.style.width = imgWidth + '%';
        largeImg.src = src;
        overlay.style.display = 'block';
        hint.style.display = 'block';
        overlay.scrollTop = 0;
    }

    function closeLarge(event) {
        if (event) { event.stopPropagation(); event.preventDefault(); }
        overlay.style.display = 'none';
        hint.style.display = 'none';
        bookWrapper.style.visibility = 'visible';
        setTimeout(() => {
            if (flipBook) flipBook.turnToPage(lastPageIndex);
        }, 50);
    }
</script>
</body>
</html>
